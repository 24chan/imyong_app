name: header-check
# 조사: 파일 주소의 응답 머리(형식) 비교 + 구글 문서 보기 화면 캡처
on:
  workflow_dispatch:
    inputs:
      urls: { description: '공백으로 구분한 주소', required: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          pip install -q pillow
          for u in $URLS; do
            echo "== $u"; curl -s -D - -o /tmp/f -r 0-1000 -A "Mozilla/5.0" "$u" | grep -iE "^(HTTP|content-type|content-disposition|content-length)"; head -c 8 /tmp/f | od -c | head -1
            g="https://docs.google.com/gview?embedded=1&url=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$u")"
            timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu --window-size=600,900 --virtual-time-budget=15000 --screenshot=/tmp/shot.png "$g" >/dev/null 2>&1
            python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/shot.png').convert('L')
          px = list(im.getdata()); dark = sum(1 for p in px if p < 200)
          print('캡처 어두운 점 비율', round(dark / len(px), 4))
          PY
          done
