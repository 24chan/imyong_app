name: practice-build
# 교대 실습학교 목록 (supabase/data/practice/*_src.json + 학교 위치) → raw-files/raw/practice/<교대>.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/data/practice/**', 'scripts/collector/practice_build.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: raw-files }
      - uses: actions/checkout@v4
        with: { path: app }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -I -u app/scripts/collector/practice_build.py raw app/supabase/data/practice
      - name: raw-files 브랜치에 저장
        run: |
          git config user.name "imyong-collector"
          git config user.email "actions@users.noreply.github.com"
          git add raw/practice
          git commit -qm "실습학교 목록 $(date +%F)" || exit 0
          ok=0; for i in 1 2 3 4 5; do if git pull -q --rebase -X theirs origin raw-files && git push -q origin HEAD:raw-files; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; [ "$ok" = 1 ]
