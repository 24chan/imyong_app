name: ncic
# 교육과정 원문 목록(NCIC) → raw-files/raw/ncic (앱 '교육과정 원문' 화면). 매주 월 04:47 KST
on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 19 * * 0'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: raw-files }
      - uses: actions/checkout@v4
        with: { path: app }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -I -u app/scripts/collector/ncic.py raw/ncic
      - name: raw-files 브랜치에 저장
        run: |
          git config user.name "imyong-collector"
          git config user.email "actions@users.noreply.github.com"
          git add raw/ncic
          git commit -qm "교육과정 원문 목록 $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin raw-files && git push -q origin HEAD:raw-files && break; sleep $((i*5)); done
