name: practice-probe
# 조사: 교대 공지에서 실습학교 글 찾기 → raw-files/raw/practice_probe (확인용, 앱에는 학교 이름만 옮김)
on:
  workflow_dispatch:
    inputs:
      univs: { description: '교대 코드(쉼표, 비우면 전부)', required: false, default: '' }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: raw-files }
      - uses: actions/checkout@v4
        with: { path: app }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -I -u app/scripts/collector/practice_probe.py raw/practice_probe "${{ github.event.inputs.univs }}"
      - name: raw-files 브랜치에 저장
        run: |
          git config user.name "imyong-collector"
          git config user.email "actions@users.noreply.github.com"
          git add raw/practice_probe
          git commit -qm "실습학교 조사 $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin raw-files && git push -q origin HEAD:raw-files && break; sleep $((i*5)); done
