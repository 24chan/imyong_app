name: push-notices
# 새 공고 푸시 알림 (알림 2단계). 오전 9시대·오후 6시대(KST)에 보내고, 손으로도 돌릴 수 있음
on:
  schedule:
    - cron: '7 0 * * *'   # 09:07 KST
    - cron: '7 9 * * *'   # 18:07 KST
  workflow_dispatch: {}
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.IMYONG }}
        run: python -I -u scripts/collector/push_notices.py
