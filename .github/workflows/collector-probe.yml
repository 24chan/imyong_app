# 자동 수집기 0단계: 17개 교육청 사이트 접속 확인 (수동 실행)
name: collector-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collector/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_result.json
