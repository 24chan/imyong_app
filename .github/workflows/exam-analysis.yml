name: exam-analysis
# 기출 분석(초등 교육과정 A·B): 교육과정 원문 칸 ↔ 기출 문항 연결 + 통계 → Supabase 비공개 저장소 pro/analysis (문항 글은 저장 안 함, 공개 GitHub에는 올리지 않음)
on:
  workflow_dispatch:
    inputs:
      debug_boxes:
        description: '문항 자리 진단할 연도 (비우면 안 함)'
        required: false
        default: ''
  schedule:
    - cron: '17 21 * * 1'   # 매주 화 06:17 KST (교육과정 목록 갱신 다음 날)
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: raw-files }
      - uses: actions/checkout@v4
        with: { path: app }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null && pip install -q pyhwp lxml six && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor >/dev/null
      - run: python -I -u app/scripts/collector/exam_analysis.py raw raw/analysis
        env:
          DEBUG_BOXES: ${{ github.event.inputs.debug_boxes }}
      # 2026-11-28 보안 보강: 정제 자료는 공개 GitHub에 두지 않고 Supabase 비공개 저장소(pro)에만 올림
      - name: 비공개 저장소(pro)에 올리기
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.IMYONG }}
        run: python -I -u app/scripts/tools/pro_upload.py raw/analysis analysis
