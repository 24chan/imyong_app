name: collector-geo
# 시군구 경계(admdongkor) → 지역별 단순화 경계 JSON → raw-files/raw/geo/<지역>.json (학교 지도 배경)
on:
  workflow_dispatch:
    inputs:
      explore:
        description: 'API 살펴보기만 (1)'
        required: false
        default: '0'
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-files
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q admdongkor shapely geopandas pyarrow
      - name: 살펴보기
        if: ${{ github.event.inputs.explore == '1' }}
        run: |
          python - <<'PY'
          import admdongkor, inspect
          print('version', getattr(admdongkor, '__version__', '?'))
          print([n for n in dir(admdongkor) if not n.startswith('_')])
          for n in ['get', 'compare', 'search']:
              f = getattr(admdongkor, n, None)
              if f:
                  print('=====', n, inspect.signature(f))
                  print(inspect.getdoc(f))
          PY
      - name: 경계 만들기
        if: ${{ github.event.inputs.explore != '1' }}
        run: python -I -u app/scripts/collector/geo.py raw/geo
      - name: 저장
        if: ${{ github.event.inputs.explore != '1' }}
        run: |
          git config user.name "imyong-collector"
          git config user.email "actions@users.noreply.github.com"
          git add raw/geo
          git commit -qm "시군구 경계 갱신 $(date +%F)" || exit 0
          git push -q origin HEAD:raw-files
