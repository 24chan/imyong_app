name: collector-crawl
on:
  workflow_dispatch:
    inputs:
      regions:
        description: '지역 코드(공백 구분, 비우면 전체)'
        required: false
        default: ''
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I scripts/collector/crawl.py ${{ github.event.inputs.regions }}
