name: pkg-fetch
# 작업 환경(npm 설치 불가)에서 타입 확인용으로 node_modules 일부를 받아 가기 위한 워크플로
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'node_modules 안 폴더 이름 (공백 구분)'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          PKGS: ${{ github.event.inputs.packages }}
        run: tar czf pkgs.tgz $(for p in $PKGS; do echo node_modules/$p; done)
      - name: tmp-pkgs 브랜치에 올리기 (아티팩트 주소는 작업 환경에서 막힘)
        run: |
          mkdir /tmp/out && mv pkgs.tgz /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b tmp-pkgs
          git config user.name bot && git config user.email actions@users.noreply.github.com
          git add pkgs.tgz && git commit -qm pkgs
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-pkgs
