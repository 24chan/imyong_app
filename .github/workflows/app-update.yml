name: app-update
# 앱 화면 코드가 main 에 올라오면 Expo Go 용 업데이트를 발행 (EAS 무료 CI 60분 한도 대신 GitHub Actions 사용)
# 필요한 GitHub Secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens)
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'app.json', 'package.json', 'package-lock.json']
  workflow_dispatch:
concurrency:
  group: app-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: EXPO_TOKEN 확인
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::GitHub Secrets 에 EXPO_TOKEN 이 없어요"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expo 업데이트 발행 (branch main)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message || '수동 발행' }}
        run: npx --yes eas-cli@latest update --branch main --message "$(echo "$MSG" | head -1)" --non-interactive
