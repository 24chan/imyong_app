name: collector-fetch
on:
  workflow_dispatch:
    inputs:
      regions:
        description: '지역 코드(공백 구분, 비우면 전체)'
        required: false
        default: 'seoul busan daegu gwangju daejeon ulsan gyeonggi gangwon chungbuk chungnam jeonbuk gyeongbuk gyeongnam jeju'
  schedule:
    - cron: '17 20 * * *'   # 매일 05:17 (한국 시간). 끝나면 collector-ingest 가 자동으로 이어서 실행
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.r.outputs.regions }}
    steps:
      - id: r
        run: |
          R="${{ github.event.inputs.regions || 'seoul busan daegu gwangju daejeon ulsan gyeonggi gangwon chungbuk chungnam jeonbuk gyeongbuk gyeongnam jeju' }}"
          echo "regions=$(echo $R | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - name: 기존 원문 파일 가져오기
        run: |
          git fetch -q origin raw-files 2>/dev/null && git checkout -q FETCH_HEAD -- raw/${{ matrix.region }} 2>/dev/null || echo "처음"
          git reset -q
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 내려받기
        run: python -I -u scripts/collector/fetch.py ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.region }}
          path: raw/${{ matrix.region }}
          if-no-files-found: ignore
          retention-days: 3
  save:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 기존 raw-files 받기
        run: |
          mkdir -p /tmp/raw
          if git fetch -q origin raw-files; then git archive FETCH_HEAD raw | tar -x -C /tmp; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: /tmp/new
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 합치기 + 구형 한글(.hwp) 변환
        run: |
          for d in /tmp/new/raw-*; do [ -d "$d" ] || continue; r=${d#/tmp/new/raw-}; mkdir -p /tmp/raw/$r; cp -r $d/. /tmp/raw/$r/; done
          pip install -q pyhwp lxml six
          (cd /tmp && bash $GITHUB_WORKSPACE/scripts/collector/convert_hwp.sh) || true
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -I scripts/collector/render_images.py /tmp/raw || true
      - name: 사립 위탁 채용 표 뽑기
        run: |
          pip install -q pdfplumber
          python -I scripts/collector/parse_private.py /tmp/raw || true
      - name: raw-files 브랜치에 저장
        run: |
          git config user.name "imyong-collector"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan raw-files-new
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/raw ./raw
          git add raw
          git commit -qm "원문 파일 갱신 $(date +%F)" || exit 0
          git push -qf origin HEAD:raw-files
